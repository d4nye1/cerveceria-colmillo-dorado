<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login - Colmillo Dorado</title>

<!-- Fuente -->
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@700&display=swap" rel="stylesheet" />

<style>
body {
  margin: 0;
  font-family: 'Cormorant Garamond', serif;
  color: #fff;
  text-align: center;
  background: url('imagenes/vaso3.jpg') no-repeat center center fixed;
  background-size: cover;
  position: relative;
}

body::before {
  content: "";
  position: fixed;
  top: 0;
  left: 0;
  height: 100%;
  width: 100%;
  background-color: rgba(0, 0, 0, 0.5);
  z-index: 0;
}

.container {
  position: relative;
  z-index: 1;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
}

.card {
  background: rgba(0, 0, 0, 0.4);
  backdrop-filter: blur(8px);
  border: 2px solid gold;
  border-radius: 16px;
  padding: 2rem 1rem;
  max-width: 420px;
  width: 100%;
  box-shadow: 0 0 20px rgba(0, 0, 0, 0.6);
}

h1 {
  font-size: 2rem;
  margin-bottom: 0.5rem;
  color: gold;
}

input {
  padding: 10px;
  margin: 10px 0;
  width: 80%;
  border-radius: 8px;
  border: none;
}

button {
  display: block;
  background: gold;
  color: #111;
  padding: 1rem;
  margin: 1rem auto;
  width: calc(100% - 2rem);
  border-radius: 90px;
  font-weight: bold;
  cursor: pointer;
  border: none;
}

button:hover {
  background: #322e1b;
  color: #ccc;
}

.registro-link {
  margin-top: 1rem;
  font-size: 0.9rem;
}
.registro-link a {
  color: gold;
  font-weight: bold;
  text-decoration: none;
}
.registro-link a:hover {
  text-decoration: underline;
}
</style>
</head>
<body>

<div class="container">
  <div class="card">
    <h1>Iniciar Sesión</h1>
    <form id="formLogin">
      <input type="email" id="email" placeholder="Email" required><br>
      <input type="password" id="password" placeholder="Contraseña" required><br>
      <button type="submit">Ingresar</button>
    </form>

    <!-- ENLACE A REGISTRO -->
    <p class="registro-link">
      ¿No tienes cuenta?
      <a href="registro.html">Regístrate aquí</a>
    </p>
  </div>
</div>

<script>
document.getElementById("formLogin").addEventListener("submit", function(e) {
  e.preventDefault();

  let email = document.getElementById("email").value.trim();
  let password = document.getElementById("password").value.trim();

  let usuarios = JSON.parse(localStorage.getItem("usuarios")) || [];
  let usuario = usuarios.find(u => u.email === email && u.password === password);

  if (!usuario) {
    mostrarMensajeModal("Usuario o contraseña incorrectos");
    return;
  }

  localStorage.setItem("usuarioActivo", JSON.stringify(usuario));
  window.location.href = "catalogo.html";
});

// Modal mensajes
function mostrarMensajeModal(texto) {
  let modalMensaje = document.getElementById("modalMensaje");
  if (!modalMensaje) {
    modalMensaje = document.createElement("div");
    modalMensaje.id = "modalMensaje";
    modalMensaje.className = "modal";
    modalMensaje.innerHTML = `<div class="modal-content" id="modalMensajeContenido"><p id="textoModalMensaje"></p></div>`;
    document.body.appendChild(modalMensaje);
  }
  document.getElementById("textoModalMensaje").textContent = texto;
  modalMensaje.style.display = "block";
  setTimeout(() => { modalMensaje.style.display = "none"; }, 3000);
}
</script>
</body>
</html>
