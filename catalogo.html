<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Catálogo - Colmillo Dorado</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@700&display=swap" rel="stylesheet" />
<style>
  body { margin:0; font-family:'Cormorant Garamond', serif; background: url('imagenes/vaso3.jpg') no-repeat center center fixed; background-size: cover; color:#fff; position:relative; }
  body::before { content:""; position:fixed; top:0; left:0; height:100%; width:100%; background-color: rgba(0,0,0,0.7); z-index:0;}
  header { position: relative; z-index:1; background: rgba(0,0,0,0.6); padding:15px 20px; border-bottom:2px solid gold; display:flex; justify-content:space-between; align-items:center;}
  .nav-izq a { background: rgba(34,30,30,0.6); color:white; padding:6px 12px; border-radius:20px; font-weight:bold; text-decoration:none; }
  .nav-izq a:hover { background: darkred; }
  .nav-der a { color:gold; margin:0 10px; text-decoration:none; font-weight:bold;}
  .nav-der a:hover { color:#fff; }
  h1 { text-align:center; margin:20px 0; color:gold; font-size:2rem; position:relative; z-index:1; }
  main { position:relative; z-index:1; display:grid; grid-template-columns: repeat(auto-fit, minmax(250px,1fr)); gap:20px; padding:20px; }
  .producto { background: rgba(0,0,0,0.5); border:2px solid gold; border-radius:16px; padding:20px; text-align:center; }
  .producto img { max-width:100%; border-radius:12px; }
  .producto h2 { margin:10px 0; color:gold; }
  .producto p { margin:5px 0; font-size:1.1rem; font-weight:bold; }
  .producto button { background:gold; color:#111; border:none; border-radius:30px; padding:8px 15px; margin:5px; cursor:pointer; font-weight:bold; }
  .producto button:hover { background:darkgoldenrod; color:white; }
  footer { position: relative; z-index:1; padding:20px; text-align:center;}
  .link-btn { display:inline-block; background:gold; color:#111; padding:10px 20px; margin:10px; border-radius:30px; font-weight:bold; text-decoration:none;}
  .link-btn:hover { background:darkgoldenrod; color:#fff; }
  .modal { display:none; position:fixed; z-index:10; left:0; top:0; width:100%; height:100%; background-color: rgba(0,0,0,0.8); }
  .modal-content { background-color: rgba(0,0,0,0.9); margin:15% auto; padding:20px; border:1px solid gold; width:80%; max-width:400px; text-align:center; border-radius:10px; }
</style>
</head>
<body>

<header>
  <nav class="nav-izq">
    <a href="#" id="cerrarSesion">Cerrar Sesión</a>
  </nav>
  <nav class="nav-der">
    <a href="index.html">Inicio</a>
    <a href="quienes.html">Quiénes Somos</a>
    <a href="catalogo.html">Productos</a>
    <a href="carrito.html" id="linkCarrito">Carrito</a>
    <a href="contacto.html">Contacto</a>
  </nav>
</header>

<h1>Nuestros productos</h1>

<main>
  <div class="producto">
    <img src="imagenes/cerveza1.jpg" alt="Cerveza IPA">
    <h2>Cerveza IPA</h2>
    <p>$80 MXN</p>
    <button class="btn-comprar" data-producto="Cerveza IPA" data-precio="80">Agregar al carrito</button>
  </div>
  <div class="producto">
    <img src="imagenes/cerveza2.jpg" alt="Cerveza Stout">
    <h2>Cerveza Stout</h2>
    <p>$90 MXN</p>
    <button class="btn-comprar" data-producto="Cerveza Stout" data-precio="90">Agregar al carrito</button>
  </div>
</main>

<footer>
  <a href="index.html" class="link-btn">Volver</a>
</footer>

<div id="modalMensaje" class="modal">
  <div class="modal-content">
    <p id="textoModalMensaje"></p>
  </div>
</div>

<script>
document.addEventListener("DOMContentLoaded", () => {
  const botones = document.querySelectorAll('.btn-comprar');
  const modalMensaje = document.getElementById("modalMensaje");
  const textoModal = document.getElementById("textoModalMensaje");

  // 🔹 Función modal + redirección
  function mostrarModalYRedir(texto, url=null){
    textoModal.textContent = texto;
    modalMensaje.style.display = "block";
    setTimeout(() => {
      modalMensaje.style.display = "none";
      if(url) window.location.href = url;
    }, 1200);
  }

  // 🔹 Verificar usuario activo
  const usuarioActivo = JSON.parse(localStorage.getItem("usuarioActivo"));
  if(!usuarioActivo){
    mostrarModalYRedir("No estás registrado. Redirigiendo a login...", "login.html");
    return;
  }

  // Agregar productos al carrito
  botones.forEach(boton=>{
    boton.addEventListener('click', ()=>{
      let producto = boton.dataset.producto;
      let precio = parseFloat(boton.dataset.precio);
      let carrito = JSON.parse(localStorage.getItem("carrito")) || [];
      let index = carrito.findIndex(p => p.producto===producto);
      if(index!==-1) carrito[index].cantidad++;
      else carrito.push({producto, precio, cantidad:1});
      localStorage.setItem("carrito", JSON.stringify(carrito));
      mostrarModalYRedir(producto + " agregado al carrito");
    });
  });

  // Cerrar sesión
  document.getElementById("cerrarSesion").addEventListener("click", ()=>{
    localStorage.removeItem("usuarioActivo");
    mostrarModalYRedir("Sesión cerrada", "index.html");
  });

  // Carrito: solo permitir si hay usuario
  document.getElementById("linkCarrito").addEventListener("click", (e)=>{
    e.preventDefault();
    const usuarioActivoActual = JSON.parse(localStorage.getItem("usuarioActivo"));
    if(usuarioActivoActual){
      window.location.href = "carrito.html";
    } else {
      mostrarModalYRedir("Debes iniciar sesión para ver el carrito", "login.html");
    }
  });
});
</script>

</body>
</html>
