<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Registro - Colmillo Dorado</title>

<!-- Fuente -->
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@700&display=swap" rel="stylesheet" />

<style>
body {
  margin: 0;
  font-family: 'Cormorant Garamond', serif;
  color: #fff;
  text-align: center;
  background: url('imagenes/vaso3.jpg') no-repeat center center fixed;
  background-size: cover;
  position: relative;
}

body::before {
  content: "";
  position: fixed;
  top: 0;
  left: 0;
  height: 100%;
  width: 100%;
  background-color: rgba(0, 0, 0, 0.5);
  z-index: 0;
}

.container {
  position: relative;
  z-index: 1;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
}

.card {
  background: rgba(0, 0, 0, 0.4);
  backdrop-filter: blur(8px);
  border: 2px solid gold;
  border-radius: 16px;
  padding: 2rem 1rem;
  max-width: 420px;
  width: 100%;
  box-shadow: 0 0 20px rgba(0, 0, 0, 0.6);
}

h1 {
  font-size: 2rem;
  margin-bottom: 0.5rem;
  color: gold;
}

input {
  padding: 10px;
  margin: 10px 0;
  width: 80%;
  border-radius: 8px;
  border: none;
}

button {
  display: block;
  background: gold;
  color: #111;
  padding: 1rem;
  margin: 1rem auto;
  width: calc(100% - 2rem);
  border-radius: 90px;
  font-weight: bold;
  cursor: pointer;
  border: none;
}

button:hover {
  background: #322e1b;
  color: #ccc;
}

.login-link {
  margin-top: 1rem;
  font-size: 0.9rem;
}
.login-link a {
  color: gold;
  font-weight: bold;
  text-decoration: none;
}
.login-link a:hover {
  text-decoration: underline;
}
</style>
</head>
<body>

<div class="container">
  <div class="card">
    <h1>Registro</h1>
    <form id="formRegistro">
      <input type="text" id="nombre" placeholder="Nombre completo"><br>
      <input type="email" id="email" placeholder="Email"><br>
      <input type="password" id="password" placeholder="Contraseña"><br>
      <input type="password" id="confirmPassword" placeholder="Confirmar contraseña"><br>
      <input type="tel" id="telefono" placeholder="Teléfono"><br>
      <input type="date" id="fechaNacimiento"><br>
      <button type="submit">Registrarse</button>
    </form>

    <!-- ENLACE A LOGIN -->
    <p class="login-link">
      ¿Ya tienes cuenta?
      <a href="login.html">Inicia sesión aquí</a>
    </p>
  </div>
</div>

<script>
document.getElementById("formRegistro").addEventListener("submit", function(e) {
  e.preventDefault();

  let nombre = document.getElementById("nombre").value.trim();
  let email = document.getElementById("email").value.trim();
  let password = document.getElementById("password").value.trim();
  let confirmPassword = document.getElementById("confirmPassword").value.trim();
  let telefono = document.getElementById("telefono").value.trim();
  let fechaNacimiento = document.getElementById("fechaNacimiento").value;

  if (!nombre) {
    alert("Ingresa tu nombre completo");
    return;
  }
  if (!email) {
    alert("Ingresa tu email");
    return;
  }
  if (!password) {
    alert("Ingresa tu contraseña");
    return;
  }
  if (!confirmPassword) {
    alert("Confirma tu contraseña");
    return;
  }
  if (password !== confirmPassword) {
    alert("Las contraseñas no coinciden.");
    return;
  }
  if (!fechaNacimiento) {
    alert("Ingresa tu fecha de nacimiento");
    return;
  }

  let usuarios = JSON.parse(localStorage.getItem("usuarios")) || [];

  if (usuarios.some(u => u.email === email)) {
    alert("El correo ya está registrado.");
    return;
  }

  let nuevoUsuario = {
    id: Date.now(),
    nombre,
    email,
    password,
    telefono,
    fechaNacimiento,
    fechaRegistro: new Date().toISOString()
  };

  usuarios.push(nuevoUsuario);
  localStorage.setItem("usuarios", JSON.stringify(usuarios));
  localStorage.setItem("usuarioActivo", JSON.stringify(nuevoUsuario));

  // Quitamos alert y vamos directo al catálogo
  window.location.href = "catalogo.html";
});

</script>
</body>
</html>
